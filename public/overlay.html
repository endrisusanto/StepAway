<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepAway - OBS Step Counter Overlay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>

  <div id="stepWidget" class="step-widget tier-starter">
    <!-- Milestone Celebration Overlay Banner -->
    <div id="milestoneBanner" class="milestone-banner">
      <div class="milestone-title">🔥 MILESTONE UNLOCKED!</div>
      <div id="milestoneValue" class="milestone-value">1,000 STEPS</div>
    </div>

    <!-- Floating Particles Layer -->
    <div id="particlesLayer" class="particles-layer"></div>

    <!-- Header info -->
    <div class="widget-header">
      <div class="user-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="userName" class="user-name">Streamer</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div id="hrChip" class="hr-chip" style="display: none;">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span id="hrChipVal">--</span> BPM
        </div>
        <div id="activityTag" class="activity-badge activity-idle">🧘 IDLE</div>
      </div>
    </div>

    <!-- Counter Display -->
    <div class="counter-box">
      <div class="step-numbers">
        <span id="currentStepVal" class="current-step-val">0</span>
        <span class="step-label">steps</span>
      </div>
      <div class="target-info">
        Goal: <span id="targetVal" class="target-val">5,000</span>
      </div>
    </div>

    <!-- Progress Bar & Percentage -->
    <div class="progress-section">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="percentDisplay" class="percent-display">0%</div>
    </div>
  </div>

  <script src="/js/overlay.js"></script>
</body>
</html>
