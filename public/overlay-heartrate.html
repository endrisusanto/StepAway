<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepAway - Live Heart Rate Overlay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body style="background: transparent; margin: 0; padding: 20px; overflow: hidden;">

  <div id="hrWidget" class="hr-widget">
    <div class="heart-icon-wrapper">
      <svg class="heart-svg" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>

    <div class="hr-data-col">
      <div class="hr-numbers">
        <span id="bpmVal" class="bpm-val">--</span>
        <span class="bpm-label">BPM</span>
      </div>
      <div id="bpmZoneLabel" class="bpm-zone-label">Connecting...</div>
    </div>
  </div>

  <script src="/js/overlay-heartrate.js"></script>
</body>
</html>
