services:
  stepaway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stepaway-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3344}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    volumes:
      - ./data:/app/data
